<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informasi Stok / Katalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Informasi Stok / Katalog Buku</h1>
            <a href="dashboard.html" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded text-sm">&larr; Dashboard</a>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Tambah Stok Buku Baru</h2>
            <form id="form-tambah-buku" class="grid grid-cols-1 md:grid-cols-5 gap-4">
                <input type="text" id="kode" required placeholder="Kode (BK-005)" class="border rounded px-3 py-2 text-sm outline-none">
                <input type="text" id="judul" required placeholder="Judul Buku" class="border rounded px-3 py-2 text-sm outline-none">
                <input type="text" id="kategori" required placeholder="Kategori" class="border rounded px-3 py-2 text-sm outline-none">
                <input type="number" id="harga" required placeholder="Harga (Rp)" class="border rounded px-3 py-2 text-sm outline-none">
                <input type="number" id="stok" required placeholder="Stok" class="border rounded px-3 py-2 text-sm outline-none">
                <div class="md:col-span-5 flex justify-end">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded text-sm">+ Tambahkan ke Tabel</button>
                </div>
            </form>
        </div>

        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-blue-600 text-white">
                    <tr>
                        <th class="py-3 px-4 text-left text-xs font-semibold uppercase">No</th>
                        <th class="py-3 px-4 text-left text-xs font-semibold uppercase">Kode</th>
                        <th class="py-3 px-4 text-left text-xs font-semibold uppercase">Judul Buku</th>
                        <th class="py-3 px-4 text-left text-xs font-semibold uppercase">Kategori</th>
                        <th class="py-3 px-4 text-right text-xs font-semibold uppercase">Harga (Rp)</th>
                        <th class="py-3 px-4 text-center text-xs font-semibold uppercase">Stok</th>
                    </tr>
                </thead>
                <tbody id="tabel-buku" class="bg-white divide-y divide-gray-200"></tbody>
            </table>
        </div>
    </div>

    <!-- Panggil data.js dari folder js/ -->
    <script src="js/data.js"></script>
    <script>
        const tabelBuku = document.getElementById('tabel-buku');
        const formTambahBuku = document.getElementById('form-tambah-buku');

        function renderBarisBuku(buku, index) {
            const tr = document.createElement('tr');
            tr.className = index % 2 === 0 ? 'bg-white' : 'bg-gray-50';
            const hargaFormatted = new Intl.NumberFormat('id-ID').format(buku.harga);
            tr.innerHTML = `
                <td class="py-3 px-4 text-sm text-gray-900">${index + 1}</td>
                <td class="py-3 px-4 text-sm font-mono text-gray-700">${buku.kode}</td>
                <td class="py-3 px-4 text-sm font-semibold text-gray-900">${buku.judul}</td>
                <td class="py-3 px-4 text-sm text-gray-600"><span class="bg-blue-100 text-blue-800 text-xs px-2.5 py-0.5 rounded">${buku.kategori}</span></td>
                <td class="py-3 px-4 text-sm text-right text-gray-900">Rp ${hargaFormatted}</td>
                <td class="py-3 px-4 text-sm text-center"><span class="px-2 py-1 text-xs rounded font-bold ${buku.stok < 10 ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}">${buku.stok} unit</span></td>
            `;
            tabelBuku.appendChild(tr);
        }

        function muatDataAwal() {
            tabelBuku.innerHTML = '';
            dataKatalogBuku.forEach((buku, index) => renderBarisBuku(buku, index));
        }

        formTambahBuku.addEventListener('submit', function(e) {
            e.preventDefault();
            const bukuBaru = {
                kode: document.getElementById('kode').value.trim(),
                judul: document.getElementById('judul').value.trim(),
                kategori: document.getElementById('kategori').value.trim(),
                harga: parseFloat(document.getElementById('harga').value),
                stok: parseInt(document.getElementById('stok').value)
            };
            dataKatalogBuku.push(bukuBaru);
            renderBarisBuku(bukuBaru, dataKatalogBuku.length - 1);
            formTambahBuku.reset();
        });

        document.addEventListener('DOMContentLoaded', muatDataAwal);
    </script>
</body>
</html>
